<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenders Listing · Tenders&amp;Bids</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="../../assets/logos/navbar-logo.png">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.3.2/css/flag-icons.min.css" />
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>
    <div id="site-header"></div>

    <main>
        <section class="main-search">
            <div class="main-shell shell">
                <div class="search-input">
                    <svg width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="m15 15-2.893-2.893m1.56-3.774A5.333 5.333 0 1 1 3 8.333a5.333 5.333 0 0 1 10.667 0Z"
                            stroke="#3B72F6" stroke-width="2" stroke-linecap="round" />
                    </svg>

                    <input type="text" value="Medical equipment government tenders in Germany">

                    <button type="button" class="clear-search" aria-label="Clear search">
                        Clear

                        <svg width="14" height="14" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <g clip-path="url(#a)">
                                <g clip-path="url(#b)">
                                    <path
                                        d="m8.625 5.375-3.25 3.25m0-3.25 3.25 3.25M12.417 7A5.417 5.417 0 1 1 1.583 7a5.417 5.417 0 0 1 10.834 0Z"
                                        stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                                </g>
                            </g>
                            <defs>
                                <clipPath id="a">
                                    <path fill="#fff" d="M0 0h14v14H0z" />
                                </clipPath>
                                <clipPath id="b">
                                    <path fill="#fff" transform="translate(.5 .5)" d="M0 0h13v13H0z" />
                                </clipPath>
                            </defs>
                        </svg>
                    </button>
                </div>

                <div class="active-filter" id="active-filter"></div>
            </div>
        </section>

        <section class="listing-shell shell">

            <!-- ===== Mobile Filter Bar ===== -->
            <div class="mobile-filter-bar">
                <button type="button" class="mobile-filter-btn" id="mobile-filter-open">
                    <span class="material-symbols-rounded">tune</span>
                    <span>Filters</span>
                </button>

                <button type="button" class="mobile-sort-btn" id="mobile-sort-open">
                    <span class="material-symbols-rounded">swap_vert</span>
                    <span>Sort</span>
                </button>
            </div>
            <!-- ===== Sidebar ===== -->
            <aside class="sidebar">
                <div class="textTitle">
                    Filters
                </div>
                <div class="top-checkbox">
                    <input type="checkbox" id="closing-30" />
                    <label for="closing-30">Closing within 30 days</label>
                </div>

                <div class="filter-block" data-filter-block="region">
                    <div class="filter-block-title">
                        <span>Region</span>
                        <svg width="12" height="12" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="m3 4.5 4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </div>
                    <div class="filterssss">
                        <div id="region-filters" class="region-filters"></div>
                    </div>
                </div>

                <div class="filter-block" data-filter-block="industry">
                    <div class="filter-block-title">
                        <span>Industry</span>
                        <svg width="12" height="12" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="m3 4.5 4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </div>
                    <div class="filterssss">
                        <div id="industry-filters" class="region-filters"></div>
                    </div>

                </div>

                <div class="filter-block" data-filter-block="type">
                    <div class="filter-block-title">
                        <span>Tender Type</span>
                        <svg width="12" height="12" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="m3 4.5 4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </div>
                    <div class="filterssss">
                        <div id="tender-type-filters" class="region-filters"></div>
                    </div>

                </div>
            </aside>

            <!-- ===== Results ===== -->
            <div class="results">
                <div class="results-header">
                    <span class="results-count" id="results-count"></span>
                    <div class="sort-control">
                        <span>Sort by:</span>
                        <div class="custom-select">
                            <select>
                                <option>Relevance</option>
                                <option>Newest</option>
                                <option>Closing soon</option>
                                <option>Value: High to low</option>
                            </select>
                            <span class="select-chevron" aria-hidden="true">
                                <svg width="12" height="12" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="m3 4.5 4 4 4-4" stroke="currentColor" stroke-width="1.6"
                                        stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                            </span>
                        </div>
                    </div>
                </div>

                <div class="save-banner">
                    <span class="left">
                        <svg width="14" height="14" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M6.995 1A4.999 4.999 0 0 0 2 5.995a5.296 5.296 0 0 0 2.708 4.627l-.21 1.37h4.997l-.21-1.37a4.997 4.997 0 0 0 2.708-4.627A4.999 4.999 0 0 0 6.995.999Z"
                                stroke="#2B62F5" stroke-width="1.199" />
                            <path d="M5.497 12.492h2.998" stroke="#2B62F5" stroke-width="1.199"
                                stroke-linecap="round" />
                        </svg> Save this search and receive alerts when new matching opportunities are published.</span>
                    <button class="btn-outline-blue">Save search + alerts</button>
                </div>

                <div class="tender-list" id="tender-list"></div>

                <div class="results-footer" id="results-footer"></div>
            </div>
        </section>
        <!-- ===== Mobile Filter Bottom Sheet ===== -->

        <div class="mobile-filter-overlay" id="mobile-filter-overlay"></div>

        <div class="mobile-filter-sheet" id="mobile-filter-sheet" aria-hidden="true">
            <div class="mobile-filter-sheet__header">
                <h3>Filters</h3>

                <button type="button" class="mobile-filter-close" id="mobile-filter-close" aria-label="Close filters">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M18 6 6 18M6 6l12 12" stroke="#94A3B8" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </button>
            </div>

            <div class="mobile-filter-sheet__body">

                <!-- Region -->
                <div class="mobile-filter-group">
                    <button type="button" class="mobile-filter-group__header" data-mobile-filter-group="region">
                        <span>
                            <strong>Region</strong>
                            <small id="mobile-region-count"></small>
                        </span>

                        <span class="material-symbols-rounded">
                            chevron_right
                        </span>
                    </button>

                    <div class="mobile-filter-group__content" id="mobile-region-filters"></div>
                </div>

                <!-- Industry -->
                <div class="mobile-filter-group">
                    <button type="button" class="mobile-filter-group__header" data-mobile-filter-group="industry">
                        <span>
                            <strong>Industry</strong>
                            <small id="mobile-industry-count"></small>
                        </span>

                        <span class="material-symbols-rounded">
                            chevron_right
                        </span>
                    </button>

                    <div class="mobile-filter-group__content" id="mobile-industry-filters"></div>
                </div>

                <!-- Tender Type -->
                <div class="mobile-filter-group">
                    <button type="button" class="mobile-filter-group__header" data-mobile-filter-group="type">
                        <span>
                            <strong>Tender Type</strong>
                            <small id="mobile-type-count"></small>
                        </span>

                        <span class="material-symbols-rounded">
                            chevron_right
                        </span>
                    </button>

                    <div class="mobile-filter-group__content" id="mobile-type-filters"></div>
                </div>

                <!-- Closing -->
                <div class="mobile-filter-group mobile-filter-group--checkbox">
                    <label class="mobile-closing-filter">
                        <span>
                            <strong>Closing within 30 days</strong>
                        </span>

                        <input type="checkbox" id="mobile-closing-30" />
                    </label>
                </div>
            </div>

            <div class="mobile-filter-sheet__footer">
                <button type="button" class="mobile-filter-reset" id="mobile-filter-reset">
                    Clear all
                </button>

                <button type="button" class="mobile-filter-apply" id="mobile-filter-apply">
                    Apply Filters
                </button>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="../../js/data.js"></script>
    <script src="../../js/components.js"></script>
    <script src="../../js/main.js"></script>
</body>

</html>
