<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenders Listing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="../../assets/logos/navbar-logo.png">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>
    <div id="site-header"></div>
    <main>
        <section class="main-search shell">
            <div class="input search-input">
                <svg width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="m15 15-2.893-2.893m1.56-3.774A5.333 5.333 0 1 1 3 8.333a5.333 5.333 0 0 1 10.667 0Z" stroke="#3B72F6" stroke-width="2" stroke-linecap="round"/></svg>

                <input type="text" placeholder="Medical equipment government tenders in Germany">

                <button type="button" class="clear-search" aria-label="Clear search">
                    <svg width="14" height="14" fill="none" xmlns="http://www.w3.org/2000/svg"><g clip-path="url(#a)"><g clip-path="url(#b)"><path d="m8.625 5.375-3.25 3.25m0-3.25 3.25 3.25M12.417 7A5.417 5.417 0 1 1 1.583 7a5.417 5.417 0 0 1 10.834 0Z" stroke="#64748B" stroke-width="2" stroke-linecap="round"/></g></g><defs><clipPath id="a"><path fill="#fff" d="M0 0h14v14H0z"/></clipPath><clipPath id="b"><path fill="#fff" transform="translate(.5 .5)" d="M0 0h13v13H0z"/></clipPath></defs></svg>
                </button>
            </div>
            <div class="active-filter" id="active-filter"></div>
        </section>
    </main>
    <div id="site-footer"></div>

    <script src="../../js/data.js"></script>
    <script src="../../js/components.js"></script>
    <script src="../../js/main.js"></script>
</body>

</html>
