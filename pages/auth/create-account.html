<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Create your account | Tenders & Bids</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
  >

  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="./auth.css" />
</head>

<body>

  <div id="site-header"></div>


  <main class="page-shell">

    <section class="auth-card" aria-label="Account creation card">

      <!-- Step Indicator -->
      <div class="step-indicator">
        <span>Step 1 of 4</span>

        <div class="step-dots">
          <span class="step-dot is-active"></span>
          <span class="step-dot is-soft"></span>
          <span class="step-dot is-soft"></span>
          <span class="step-dot is-soft"></span>
        </div>
      </div>


      <!-- Header Section -->
      <div class="auth-card__header">

        <h1 class="auth-title">
          Create your account
        </h1>

        <p class="auth-subtitle">
          Tell us a little about yourself.
        </p>

      </div>


      <!-- Form Section -->
      <div class="auth-card__email">

        <div class="field">
          <label for="full-name">Full Name</label>

          <input
            id="full-name"
            type="text"
            placeholder="John Doe"
            value="John Doe"
          />
        </div>


        <div class="field">
          <label for="contact-number">Contact number</label>

          <input
            id="contact-number"
            type="tel"
            placeholder="Contact number"
          />
        </div>


        <div class="field">
          <label for="company-name">Company Name</label>

          <input
            id="company-name"
            type="text"
            placeholder="Acme Corporation"
            value="Acme Corporation"
          />
        </div>


        <button
          class="primary-btn"
          type="button"
          data-next="industries.html"
        >
          Continue
        </button>

      </div>


      <!-- Footer Section -->
      <div class="auth-card__legal">

        <p class="auth-meta">
          Already have an account?
          <a href="./login.html">Sign in</a>
        </p>

      </div>

    </section>

  </main>


  <script src="../../js/data.js"></script>
  <script src="../../js/components.js"></script>
  <script src="./auth.js"></script>

</body>
</html>
