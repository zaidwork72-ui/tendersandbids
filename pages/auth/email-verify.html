<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Check your email | Tenders & Bids</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
  >

  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="./auth.css" />
</head>

<body>

  <div id="site-header"></div>


  <main class="page-shell">

    <section class="auth-card" aria-label="Email verification card">

      <!-- 1. Header Section -->
      <div class="auth-card__header">
        <h1 class="auth-title">Check your email</h1>

        <p class="auth-subtitle">
          We sent a 6-digit code to
          <strong class="verify-email">your@email.com</strong>
        </p>
      </div>


      <!-- 2. Verification Section -->
      <div class="auth-card__email">

        <div class="field">
          <label>Verify code</label>

          <div class="verify-box">
            <input
              class="code-input"
              type="text"
              inputmode="numeric"
              maxlength="1"
              aria-label="Digit 1"
            />

            <input
              class="code-input"
              type="text"
              inputmode="numeric"
              maxlength="1"
              aria-label="Digit 2"
            />

            <input
              class="code-input"
              type="text"
              inputmode="numeric"
              maxlength="1"
              aria-label="Digit 3"
            />

            <input
              class="code-input"
              type="text"
              inputmode="numeric"
              maxlength="1"
              aria-label="Digit 4"
            />

            <input
              class="code-input"
              type="text"
              inputmode="numeric"
              maxlength="1"
              aria-label="Digit 5"
            />

            <input
              class="code-input"
              type="text"
              inputmode="numeric"
              maxlength="1"
              aria-label="Digit 6"
            />
          </div>
        </div>

        <button
          class="primary-btn"
          type="button"
          data-next="create-account.html"
        >
          Verify Code
        </button>

      </div>


      <!-- 3. Footer Section -->
      <div class="auth-card__legal">

        <p class="auth-meta">
          Didn't receive it?
          <a href="email-verify.html">Resend code</a>
        </p>

        <p class="auth-meta auth-meta--back">
          <a href="login.html">← Back to email</a>
        </p>

      </div>

    </section>

  </main>


  <script src="../../js/data.js"></script>
  <script src="../../js/components.js"></script>
  <script src="./auth.js"></script>

</body>
</html>
