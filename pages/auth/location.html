<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Where are you looking for opportunities? | Tenders & Bids</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">

    <!-- Global CSS -->
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/components.css">

    <!-- Location specific CSS -->
    <link rel="stylesheet" href="./auth.css" />
</head>

<body>

    <div id="site-header"></div>


    <!-- ==================== PAGE ==================== -->

    <main class="location-page">

        <section class="location-card" aria-label="Location selection card">

            <!-- ==================== STEP INDICATOR ==================== -->

            <div class="location-step">

                <span class="location-step__text">
                    Step 3 of 4
                </span>

                <div class="location-step__dots">
                    <span class="location-step__dot is-active"></span>
                    <span class="location-step__dot is-active"></span>
                    <span class="location-step__dot is-active"></span>
                    <span class="location-step__dot is-soft"></span>
                </div>

            </div>


            <!-- ==================== HEADER ==================== -->

            <div class="location-header">

                <h1 class="location-title">
                    Where are you looking for
                    opportunities?
                </h1>

                <p class="location-subtitle">
                    Select the countries or markets you want to monitor.
                    You can refine your locations anytime.
                </p>

            </div>


            <!-- ==================== LOCATION CONTENT ==================== -->

            <div class="location-content">


                <!-- Main Country Search -->

                <div class="location-search">

                    <span class="material-symbols-rounded location-search__icon">
                        search
                    </span>

                    <input type="text" placeholder="Search and add countries..." aria-label="Search countries" />

                </div>


                <div id="location-groups"></div>



                <!-- ==================== CONTINUE ==================== -->



            </div>


            <!-- ==================== FOOTER ==================== -->

            <div class="location-footer">
                                <button class="location-continue" type="button" data-next="notifications.html">
                    Continue
                </button>

                <a href="notifications.html" class="location-skip">
                    Skip for now
                </a>

            </div>

        </section>

    </main>


    <script src="./auth.js"></script>
    <script src="../../js/components.js"></script>\
    <script src="../../js/data.js"></script>

</body>

</html>
